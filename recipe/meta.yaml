{% set name = "eth-event" %}
{% set version = "1.2.6" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 272db439ce7a2b0a4633538f76c6ee0b4e24de676f3fea57b2deed681fc80796

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6,<4.0
  run:
    - eth-abi >=2.0.0,<3.0.0
    - eth-hash >=0.2.0,<1.0.0
    - eth-utils >=1.2.0,<2.0.0
    - hexbytes >=0.2.0,<1.0.0
    - python >=3.6,<4.0

test:
  imports:
    - eth_event
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/iamdefinitelyahuman/eth-event
  summary: Ethereum event decoder and topic generator
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - spinoch
    - iamdefinitelyahuman
